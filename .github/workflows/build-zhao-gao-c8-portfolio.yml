name: Build Zhao-Gao-C8 portfolio PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/research-status/BUILD_PORTFOLIO'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             texlive-xetex texlive-lang-chinese texlive-latex-extra             texlive-fonts-recommended fonts-noto-cjk fonts-liberation             fonts-dejavu-core

      - name: Reassemble LaTeX source
        run: |
          cd docs/research-status
          cat source-parts/part*.b64 | tr -d '\n\r' | base64 -d > zhao-gao-c8-portfolio-2026-09-18.tex
          test "$(sha256sum zhao-gao-c8-portfolio-2026-09-18.tex | cut -d' ' -f1)" = "14abb53928b00fec6d4bc7887b703410fc972465f40198017602dfddb18ba665"

      - name: Build PDF
        run: |
          cd docs/research-status
          for i in 1 2 3 4; do
            xelatex -interaction=nonstopmode -halt-on-error zhao-gao-c8-portfolio-2026-09-18.tex
          done
          test -s zhao-gao-c8-portfolio-2026-09-18.pdf

      - name: Commit reproducible report
        run: |
          rm -rf docs/research-status/source-parts docs/research-status/BUILD_PORTFOLIO
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/research-status
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: build Zhao/Gao/C8 portfolio report [skip ci]"
          git push
