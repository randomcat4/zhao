name: Build Zhao-Gao-C8 portfolio PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/research-status/BUILD_PORTFOLIO'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-fonts-recommended fonts-noto-cjk fonts-liberation \
            fonts-dejavu-core

      - name: Reassemble LaTeX source
        run: |
          cd docs/research-status
          cat \
            source-parts-20260919/part00.b64 \
            source-parts-20260919/part01.b64 \
            source-parts-20260919/fix02.b64 \
            source-parts-20260919/fix03.b64 \
            source-parts-20260919/part03.b64 \
            source-parts-20260919/part04.b64 \
            source-parts-20260919/part05.b64 \
            source-parts-20260919/part06.b64 \
            source-parts-20260919/fix08.b64 \
            source-parts-20260919/fix09.b64 \
          | tr -d '[:space:]' | base64 -d > 2026-09-19-zhao-gao-portfolio.tex
          test "$(sha256sum 2026-09-19-zhao-gao-portfolio.tex | cut -d' ' -f1)" = "059ea1d2816efce3ee69e3c5a7735bbeb60b5abe2fdb477bafce169b2d76a3e3"

      - name: Build PDF
        run: |
          cd docs/research-status
          for i in 1 2 3 4; do
            xelatex -interaction=nonstopmode -halt-on-error 2026-09-19-zhao-gao-portfolio.tex
          done
          test -s 2026-09-19-zhao-gao-portfolio.pdf

      - name: Commit reproducible report
        run: |
          rm -rf docs/research-status/source-parts docs/research-status/source-parts-20260919 docs/research-status/BUILD_PORTFOLIO
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/research-status
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: build 2026-09-19 Zhao/Gao/C8 portfolio [skip ci]"
          git push
