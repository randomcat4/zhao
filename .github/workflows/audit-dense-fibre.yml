name: Zhao dense-fibre full replay

on:
  workflow_dispatch:
  push:
    branches:
      - audit/zhao-harvest-20260905
    paths:
      - ".github/workflows/audit-dense-fibre.yml"
      - "research/2026-09-05_zhao_completion/pro_round2/02_dense_fibre/**"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/2026-09-05_zhao_completion/pro_round2/02_dense_fibre
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the omitted rank-three root table
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -Wno-misleading-indentation generate_roots.cpp -o "$RUNNER_TEMP/generate_roots"
          "$RUNNER_TEMP/generate_roots" rank3_roots.txt | tee "$RUNNER_TEMP/root-generation.log"
      - name: Run the complete independent replay
        run: python3 -I run_all.py --output "$RUNNER_TEMP/dense-replay" --threads 4
      - name: Preserve replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dense-fibre-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/root-generation.log
            ${{ runner.temp }}/dense-replay
          if-no-files-found: warn
